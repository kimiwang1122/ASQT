[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asqt"
version = "0.1.0"
description = "A-share quantitative trading system baseline"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=17,<23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
asqt = "asqt.cli:main"

[tool.setuptools.packages.find]
include = ["asqt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

